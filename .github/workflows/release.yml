name: Release

# Obsidian installs a plugin from a GitHub release whose tag matches the
# manifest version exactly (no leading "v"), with main.js, manifest.json, and
# styles.css attached as individual assets — not a zip.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Both are required by actions/attest-build-provenance: id-token to get the
  # OIDC token that proves the build ran here, attestations to record it.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Lets anyone verify the assets were built from this repo, by this
      # workflow, with `gh attestation verify main.js -R <owner>/<repo>`.
      # Only the built files are attested; manifest.json ships as committed.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag '$TAG' does not match manifest version '$MANIFEST'." >&2
            exit 1
          fi

      # Idempotent on purpose. Creating a release in the GitHub UI or via
      # `gh release create` also creates the tag, which fires this workflow —
      # so by the time it runs, the release may already exist. Uploading to the
      # existing release covers that case; creating covers a bare tag push.
      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes \
              main.js manifest.json styles.css
          fi
